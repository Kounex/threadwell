# Copy to .github/dependabot.yml; list every image's build directory.
# Pin each Dockerfile base as `image:<exact tag>@sha256:<index digest>`:
# Dependabot then also opens a PR when upstream rebuilds the same tag (new
# OS packages), which is the whole point. Patch and digest-only PRs merge
# themselves (see image-caller.example.yml); minor/major ones wait for you.
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/board"]
    schedule:
      interval: weekly
    # Supply-chain cooldown (2026-11-06): only propose a release once it has
    # been public this long, so a compromised one is usually pulled first.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 7
    ignore:
      # Python minor/major and Node major upgrades are deliberate migrations
      # (missing wheels, removed modules, yarn gone from node 25+), not
      # refreshes. Patches and same-tag digests still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directories: ["/board"]
    schedule:
      interval: weekly
    # Supply-chain cooldown (2026-11-06): only propose a release once it has
    # been public this long, so a compromised one is usually pulled first.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 7
    # All patch updates in one weekly PR (Dependabot only puts patches in a
    # group restricted to them), which merges itself. Minors and majors come
    # as separate PRs and wait for a human.
    groups:
      patches:
        update-types: ["patch"]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # Supply-chain cooldown (2026-11-06): only propose a release once it has
    # been public this long, so a compromised one is usually pulled first.
    cooldown:
      default-days: 3
      semver-minor-days: 7
      semver-major-days: 7
    groups:
      actions:
        patterns: ["*"]
